name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version label (e.g., 0.0.1 or 9.3.1)"
        required: true
        default: "0.0.1"

permissions:
  contents: write

jobs:
  package:
    name: Package zel (${{ matrix.bazel_os }}-${{ matrix.bazel_arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            bazel_os: linux
            bazel_arch: x86_64
            rust_target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            bazel_os: linux
            bazel_arch: arm64
            rust_target: aarch64-unknown-linux-gnu
          - runner: macos-14
            bazel_os: darwin
            bazel_arch: x86_64
            rust_target: x86_64-apple-darwin
          - runner: macos-14
            bazel_os: darwin
            bazel_arch: arm64
            rust_target: aarch64-apple-darwin
          - runner: windows-latest
            bazel_os: windows
            bazel_arch: x86_64
            rust_target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Determine release version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
          else
            VER="${GITHUB_REF#refs/tags/}"
            VER="${VER#v}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Build and package release binaries
        shell: bash
        run: |
          ./scripts/package_zel.sh \
            --version "${{ steps.version.outputs.version }}" \
            --os "${{ matrix.bazel_os }}" \
            --arch "${{ matrix.bazel_arch }}" \
            --target "${{ matrix.rust_target }}" \
            --output-dir dist/release

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zel-${{ matrix.bazel_os }}-${{ matrix.bazel_arch }}
          path: dist/release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all packaged platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -lh release-assets/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          fi
          if gh release view "${TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release-assets/* --clobber --repo "${{ github.repository }}"
          else
            gh release create "${TAG}" release-assets/* \
              --repo "${{ github.repository }}" \
              --title "Zel ${TAG}" \
              --generate-notes
          fi
